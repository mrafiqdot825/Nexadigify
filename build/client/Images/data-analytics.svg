<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="55%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#0E1330"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4F5FE0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FA0FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="barGradCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E7C6F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F5FE0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4F5FE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g stroke="#8FA0FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 270 H1920"/><path d="M0 540 H1920"/><path d="M0 810 H1920"/>
    <path d="M480 0 V1080"/><path d="M960 0 V1080"/><path d="M1440 0 V1080"/>
  </g>
  <circle cx="1000" cy="600" r="500" fill="url(#glow)" filter="url(#softBlur)"/>

  <!-- scattered, fragmented raw data left of frame -->
  <g fill="#5B6584" opacity="0.8">
    <rect x="120" y="200" width="10" height="10" rx="2"/>
    <rect x="220" y="320" width="8" height="8" rx="2"/>
    <rect x="90" y="440" width="12" height="12" rx="2"/>
    <rect x="260" y="500" width="9" height="9" rx="2"/>
    <rect x="150" y="620" width="10" height="10" rx="2"/>
    <rect x="300" y="260" width="8" height="8" rx="2"/>
  </g>
  <g stroke="#5B6584" stroke-width="1" stroke-dasharray="2 6" opacity="0.5" fill="none">
    <path d="M130 205 C 300 300, 500 400, 660 500"/>
    <path d="M228 328 C 380 400, 540 450, 660 500"/>
    <path d="M100 448 C 320 480, 500 500, 660 510"/>
    <path d="M268 508 C 420 510, 540 510, 660 512"/>
    <path d="M158 628 C 350 580, 520 540, 660 515"/>
  </g>

  <!-- unified analytics dashboard, right two-thirds of frame -->
  <rect x="680" y="260" width="1140" height="640" rx="18" fill="#0E1330" stroke="#3A4270" stroke-width="1.5" opacity="0.9"/>
  <line x1="680" y1="330" x2="1820" y2="330" stroke="#3A4270" stroke-width="1"/>
  <g fill="#5B6584">
    <circle cx="720" cy="295" r="6"/>
    <circle cx="745" cy="295" r="6"/>
    <circle cx="770" cy="295" r="6"/>
  </g>

  <!-- bar chart -->
  <g>
    <rect x="740" y="700" width="60" height="140" fill="url(#barGrad)" rx="6"/>
    <rect x="820" y="640" width="60" height="200" fill="url(#barGrad)" rx="6"/>
    <rect x="900" y="560" width="60" height="280" fill="url(#barGradCyan)" rx="6"/>
    <rect x="980" y="600" width="60" height="240" fill="url(#barGrad)" rx="6"/>
    <rect x="1060" y="500" width="60" height="340" fill="url(#barGradCyan)" rx="6"/>
    <line x1="720" y1="840" x2="1140" y2="840" stroke="#3A4270" stroke-width="1"/>
  </g>

  <!-- trend line chart -->
  <g filter="url(#nodeGlow)">
    <path d="M1200 700 L1290 620 L1380 660 L1470 540 L1560 580 L1650 460 L1740 500"
          stroke="#5EEAD4" stroke-width="3" fill="none"/>
    <circle cx="1200" cy="700" r="4" fill="#5EEAD4"/>
    <circle cx="1290" cy="620" r="4" fill="#5EEAD4"/>
    <circle cx="1380" cy="660" r="4" fill="#5EEAD4"/>
    <circle cx="1470" cy="540" r="4" fill="#5EEAD4"/>
    <circle cx="1560" cy="580" r="4" fill="#5EEAD4"/>
    <circle cx="1650" cy="460" r="4" fill="#5EEAD4"/>
    <circle cx="1740" cy="500" r="5" fill="#EAF0FF"/>
  </g>
  <path d="M1200 700 L1290 620 L1380 660 L1470 540 L1560 580 L1650 460 L1740 500 L1740 840 L1200 840 Z"
        fill="#5EEAD4" opacity="0.08"/>
  <line x1="1200" y1="840" x2="1780" y2="840" stroke="#3A4270" stroke-width="1"/>

  <!-- summary readouts -->
  <g fill="#DCE3FF" opacity="0.9">
    <rect x="1180" y="380" width="110" height="8" rx="4" opacity="0.4"/>
    <rect x="1180" y="405" width="70" height="14" rx="4"/>
    <rect x="1420" y="380" width="110" height="8" rx="4" opacity="0.4"/>
    <rect x="1420" y="405" width="90" height="14" rx="4"/>
    <rect x="1660" y="380" width="110" height="8" rx="4" opacity="0.4"/>
    <rect x="1660" y="405" width="60" height="14" rx="4"/>
  </g>

  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="1800" cy="200" r="1.5"/><circle cx="500" cy="850" r="1.5"/>
    <circle cx="1000" cy="150" r="1.5"/><circle cx="350" cy="950" r="1.5"/>
  </g>
</svg>
