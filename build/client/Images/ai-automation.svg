<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="55%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#0E1330"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F5FE0" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8FA0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.7"/>
    </linearGradient>
    <filter name="softBlur" id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g stroke="#8FA0FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 270 H1920"/><path d="M0 540 H1920"/><path d="M0 810 H1920"/>
    <path d="M480 0 V1080"/><path d="M960 0 V1080"/><path d="M1440 0 V1080"/>
  </g>
  <circle cx="960" cy="540" r="480" fill="url(#glow)" filter="url(#softBlur)" opacity="0.35"/>

  <!-- the automation "belt": a looping track carrying task-nodes through stages -->
  <path d="M 220 540 C 500 300, 800 300, 960 540 C 1120 780, 1420 780, 1700 540"
        stroke="url(#beltGrad)" stroke-width="4" fill="none"/>
  <path d="M 220 540 C 500 300, 800 300, 960 540 C 1120 780, 1420 780, 1700 540"
        stroke="#0B0F1F" stroke-width="18" fill="none" opacity="0.0"/>

  <!-- rail underneath for depth -->
  <path d="M 220 560 C 500 320, 800 320, 960 560 C 1120 800, 1420 800, 1700 560"
        stroke="#3A4270" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- stage gates along the belt -->
  <g stroke="#8FA0FF" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <rect x="430" y="330" width="60" height="90" rx="8" transform="rotate(-18 460 375)"/>
    <rect x="900" y="500" width="60" height="90" rx="8"/>
    <rect x="1330" y="500" width="60" height="90" rx="8" transform="rotate(18 1360 545)"/>
  </g>

  <!-- task tokens moving along the belt, transforming from raw square to refined circle -->
  <g filter="url(#nodeGlow)">
    <rect x="205" y="525" width="20" height="20" rx="3" fill="#C9D1FF"/>
    <rect x="455" y="360" width="16" height="16" rx="3" fill="#DCE3FF" transform="rotate(-18 463 368)"/>
    <circle cx="930" cy="545" r="9" fill="#EAF0FF"/>
    <circle cx="1360" cy="545" r="9" fill="#5EEAD4"/>
    <circle cx="1690" cy="540" r="11" fill="#5EEAD4"/>
  </g>

  <!-- checkmark burst at the end signifying completion -->
  <g stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#nodeGlow)">
    <path d="M1770 520 L1790 540 L1830 495"/>
  </g>
  <circle cx="1790" cy="540" r="42" stroke="#5EEAD4" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>

  <!-- looping return arrows suggesting continuous automated cycles -->
  <g stroke="#5B6584" stroke-width="1.4" fill="none" opacity="0.6">
    <path d="M240 620 C 400 760, 700 800, 960 640" stroke-dasharray="4 8"/>
    <path d="M950 645 l -14 -6 l 4 16 z" fill="#5B6584" stroke="none"/>
  </g>

  <!-- ambient particles -->
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="300" cy="200" r="1.5"/><circle cx="1600" cy="200" r="1.5"/>
    <circle cx="1700" cy="850" r="1.5"/><circle cx="400" cy="900" r="1.5"/>
    <circle cx="1000" cy="150" r="1.5"/>
  </g>
</svg>
