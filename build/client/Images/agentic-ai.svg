<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="55%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#0E1330"/>
    </linearGradient>
    <radialGradient id="agentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9F7CFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9F7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g stroke="#8FA0FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 270 H1920"/><path d="M0 540 H1920"/><path d="M0 810 H1920"/>
    <path d="M480 0 V1080"/><path d="M960 0 V1080"/><path d="M1440 0 V1080"/>
  </g>

  <circle cx="620" cy="480" r="380" fill="url(#agentGlow)" filter="url(#softBlur)" opacity="0.4"/>

  <!-- central agent core -->
  <g filter="url(#nodeGlow)">
    <circle cx="620" cy="480" r="26" fill="#EAF0FF"/>
    <circle cx="620" cy="480" r="40" stroke="#9F7CFF" stroke-width="1.5" fill="none" opacity="0.7"/>
    <circle cx="620" cy="480" r="58" stroke="#9F7CFF" stroke-width="1" fill="none" opacity="0.35"/>
  </g>

  <!-- decision branches: the agent reasons, then forks into multiple autonomous action paths -->
  <g stroke="#8FA0FF" stroke-opacity="0.7" stroke-width="1.6" fill="none">
    <path d="M646 460 C 900 340, 1150 300, 1420 260"/>
    <path d="M660 490 C 950 460, 1200 470, 1480 500"/>
    <path d="M646 510 C 900 620, 1150 700, 1400 780"/>
    <path d="M600 520 C 800 700, 950 820, 1150 900"/>
  </g>

  <!-- secondary decision forks off the first branch, showing multi-step reasoning -->
  <g stroke="#5EEAD4" stroke-opacity="0.6" stroke-width="1.3" fill="none">
    <path d="M1420 260 C 1500 220, 1580 210, 1660 190"/>
    <path d="M1420 260 C 1500 300, 1580 320, 1660 340"/>
    <path d="M1400 780 C 1480 750, 1560 760, 1640 730"/>
    <path d="M1400 780 C 1480 820, 1560 850, 1640 870"/>
  </g>

  <!-- action nodes at branch tips: each an autonomous "task executed" -->
  <g filter="url(#nodeGlow)">
    <circle cx="1420" cy="260" r="8" fill="#C9D1FF"/>
    <circle cx="1480" cy="500" r="8" fill="#C9D1FF"/>
    <circle cx="1400" cy="780" r="8" fill="#C9D1FF"/>
    <circle cx="1150" cy="900" r="8" fill="#C9D1FF"/>

    <circle cx="1660" cy="190" r="6" fill="#5EEAD4"/>
    <circle cx="1660" cy="340" r="6" fill="#5EEAD4"/>
    <circle cx="1640" cy="730" r="6" fill="#5EEAD4"/>
    <circle cx="1640" cy="870" r="6" fill="#5EEAD4"/>
  </g>

  <!-- completion marks on executed actions -->
  <g stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M1650 184 l 6 6 l 12 -12"/>
    <path d="M1650 334 l 6 6 l 12 -12"/>
    <path d="M1630 724 l 6 6 l 12 -12"/>
    <path d="M1630 864 l 6 6 l 12 -12"/>
  </g>

  <!-- faint incoming context/input lines feeding the agent from the left -->
  <g stroke="#5B6584" stroke-width="1.2" stroke-dasharray="3 7" fill="none" opacity="0.6">
    <path d="M120 300 C 300 350, 460 400, 590 450"/>
    <path d="M100 560 C 280 540, 450 510, 585 495"/>
    <path d="M150 720 C 320 660, 470 590, 600 530"/>
  </g>
  <g fill="#5B6584">
    <circle cx="120" cy="300" r="3"/>
    <circle cx="100" cy="560" r="3"/>
    <circle cx="150" cy="720" r="3"/>
  </g>

  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="900" cy="150" r="1.5"/><circle cx="1750" cy="500" r="1.5"/>
    <circle cx="1500" cy="950" r="1.5"/><circle cx="300" cy="900" r="1.5"/>
  </g>
</svg>
