<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="55%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#0E1330"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A4270" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4F5FE0" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F5FE0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8FA0FF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FA0FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F5FE0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F5FE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g stroke="#8FA0FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 270 H1920"/><path d="M0 540 H1920"/><path d="M0 810 H1920"/>
    <path d="M480 0 V1080"/><path d="M960 0 V1080"/><path d="M1440 0 V1080"/>
  </g>
  <circle cx="960" cy="540" r="480" fill="url(#glow)" filter="url(#softBlur)"/>

  <!-- isometric stacked layers: infrastructure (bottom) to interface (top) -->
  <g>
    <!-- infrastructure layer -->
    <polygon points="960,760 1360,650 960,540 560,650" fill="url(#layer1)" stroke="#5B6584" stroke-width="1"/>
    <!-- backend / API layer -->
    <polygon points="960,620 1360,510 960,400 560,510" fill="url(#layer2)" stroke="#5B6584" stroke-width="1"/>
    <!-- interface layer -->
    <polygon points="960,480 1360,370 960,260 560,370" fill="url(#layer3)" stroke="#5B6584" stroke-width="1"/>
  </g>

  <!-- connecting verticals between layers, showing engineered continuity -->
  <g stroke="#8FA0FF" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 5">
    <line x1="960" y1="540" x2="960" y2="400"/>
    <line x1="960" y1="400" x2="960" y2="260"/>
    <line x1="560" y1="650" x2="560" y2="510"/>
    <line x1="560" y1="510" x2="560" y2="370"/>
    <line x1="1360" y1="650" x2="1360" y2="510"/>
    <line x1="1360" y1="510" x2="1360" y2="370"/>
  </g>

  <!-- interface layer detail: browser-window chrome floating above the top plane -->
  <g filter="url(#nodeGlow)">
    <rect x="820" y="150" width="280" height="170" rx="10" fill="#0E1330" stroke="#5EEAD4" stroke-width="1.5" opacity="0.95"/>
    <line x1="820" y1="185" x2="1100" y2="185" stroke="#3A4270" stroke-width="1"/>
    <circle cx="845" cy="167" r="4" fill="#5EEAD4"/>
    <circle cx="862" cy="167" r="4" fill="#8FA0FF"/>
    <circle cx="879" cy="167" r="4" fill="#DCE3FF"/>
    <rect x="845" y="205" width="180" height="10" rx="3" fill="#8FA0FF" opacity="0.5"/>
    <rect x="845" y="230" width="130" height="8" rx="3" fill="#5B6584"/>
    <rect x="845" y="250" width="150" height="8" rx="3" fill="#5B6584"/>
    <rect x="845" y="280" width="80" height="24" rx="6" fill="#5EEAD4" opacity="0.8"/>
  </g>

  <!-- code brackets floating near backend layer -->
  <g fill="none" stroke="#DCE3FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#nodeGlow)">
    <path d="M1450 470 l -24 22 l 24 22"/>
    <path d="M1560 470 l 24 22 l -24 22"/>
  </g>

  <!-- server/infra icon near bottom layer -->
  <g filter="url(#nodeGlow)">
    <rect x="1440" y="700" width="120" height="90" rx="8" fill="#0E1330" stroke="#8FA0FF" stroke-width="1.5"/>
    <line x1="1440" y1="730" x2="1560" y2="730" stroke="#3A4270" stroke-width="1"/>
    <line x1="1440" y1="760" x2="1560" y2="760" stroke="#3A4270" stroke-width="1"/>
    <circle cx="1455" cy="715" r="3" fill="#5EEAD4"/>
    <circle cx="1455" cy="745" r="3" fill="#5EEAD4"/>
    <circle cx="1455" cy="775" r="3" fill="#8FA0FF"/>
  </g>

  <!-- database cylinder mirrored on the left -->
  <g filter="url(#nodeGlow)" fill="none" stroke="#8FA0FF" stroke-width="1.5">
    <ellipse cx="400" cy="710" rx="60" ry="18"/>
    <path d="M340 710 V760 C340 770, 460 770, 460 760 V710"/>
    <ellipse cx="400" cy="735" rx="60" ry="18" opacity="0.5"/>
  </g>

  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="1750" cy="200" r="1.5"/><circle cx="250" cy="300" r="1.5"/>
    <circle cx="1700" cy="950" r="1.5"/><circle cx="300" cy="950" r="1.5"/>
  </g>
</svg>
