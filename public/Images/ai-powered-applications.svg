<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="55%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#0E1330"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C8CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12162B"/>
      <stop offset="100%" stop-color="#0B0F1F"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g stroke="#8FA0FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 270 H1920"/><path d="M0 540 H1920"/><path d="M0 810 H1920"/>
    <path d="M480 0 V1080"/><path d="M960 0 V1080"/><path d="M1440 0 V1080"/>
  </g>
  <circle cx="960" cy="540" r="460" fill="url(#coreGlow)" filter="url(#softBlur)" opacity="0.3"/>

  <!-- phone / app frame, center -->
  <rect x="800" y="210" width="320" height="660" rx="36" fill="url(#screenGrad)" stroke="#3A4270" stroke-width="2"/>
  <rect x="820" y="250" width="280" height="540" rx="8" fill="#0B0F1F"/>
  <rect x="895" y="222" width="130" height="14" rx="7" fill="#0B0F1F"/>

  <!-- app UI content -->
  <g>
    <circle cx="960" cy="330" r="10" fill="#5EEAD4"/>
    <rect x="850" y="380" width="220" height="12" rx="4" fill="#8FA0FF" opacity="0.6"/>
    <rect x="850" y="404" width="150" height="8" rx="3" fill="#5B6584"/>
    <rect x="850" y="440" width="220" height="70" rx="10" fill="#12162B" stroke="#3A4270" stroke-width="1"/>
    <rect x="850" y="524" width="220" height="70" rx="10" fill="#12162B" stroke="#3A4270" stroke-width="1"/>
    <rect x="850" y="608" width="220" height="70" rx="10" fill="#12162B" stroke="#3A4270" stroke-width="1"/>
    <circle cx="875" cy="475" r="10" fill="#5EEAD4" opacity="0.7"/>
    <circle cx="875" cy="559" r="10" fill="#8FA0FF" opacity="0.7"/>
    <circle cx="875" cy="643" r="10" fill="#8FA0FF" opacity="0.7"/>
    <rect x="900" y="465" width="140" height="8" rx="3" fill="#DCE3FF" opacity="0.7"/>
    <rect x="900" y="549" width="120" height="8" rx="3" fill="#DCE3FF" opacity="0.5"/>
    <rect x="900" y="633" width="130" height="8" rx="3" fill="#DCE3FF" opacity="0.5"/>
  </g>

  <!-- intelligence core embedded behind/within the screen, visible glowing through -->
  <g filter="url(#nodeGlow)" opacity="0.9">
    <circle cx="960" cy="330" r="26" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity="0.6"/>
    <circle cx="960" cy="330" r="40" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- neural connections radiating out from the app into the surrounding system -->
  <g stroke="#8FA0FF" stroke-opacity="0.55" stroke-width="1.4" fill="none">
    <path d="M800 350 C 600 300, 420 260, 260 220"/>
    <path d="M800 450 C 560 420, 380 420, 200 420"/>
    <path d="M800 600 C 560 640, 380 680, 200 720"/>
    <path d="M1120 350 C 1320 300, 1500 260, 1680 220"/>
    <path d="M1120 450 C 1360 420, 1540 420, 1740 420"/>
    <path d="M1120 600 C 1360 640, 1540 680, 1740 720"/>
  </g>

  <!-- endpoint nodes: other connected surfaces (web, api, devices) -->
  <g filter="url(#nodeGlow)" fill="#C9D1FF">
    <circle cx="260" cy="220" r="7"/>
    <circle cx="200" cy="420" r="7"/>
    <circle cx="200" cy="720" r="7"/>
    <circle cx="1680" cy="220" r="7"/>
    <circle cx="1740" cy="420" r="7"/>
    <circle cx="1740" cy="720" r="7"/>
  </g>

  <!-- small device glyphs at two endpoints -->
  <g stroke="#5EEAD4" stroke-width="1.5" fill="none" opacity="0.8">
    <rect x="150" y="380" width="100" height="66" rx="6"/>
    <line x1="150" y1="428" x2="250" y2="428"/>
    <circle cx="1690" cy="380" r="30" />
    <path d="M1675 380 h30 M1690 365 v30"/>
  </g>

  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="500" cy="150" r="1.5"/><circle cx="1450" cy="150" r="1.5"/>
    <circle cx="400" cy="950" r="1.5"/><circle cx="1500" cy="950" r="1.5"/>
  </g>
</svg>
